plugins { id 'com.android.application' }

def withoutNative = Boolean.parseBoolean(providers.gradleProperty('withoutNative').getOrElse('false'))

android {
    namespace 'org.xiangqi.study'
    compileSdk 35
    defaultConfig {
        applicationId 'org.xiangqi.study'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.7.5'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libpikafish.so'] } }
    // The x86 emulator exercises the same Java UI/core without ARM machine code.
    if (withoutNative) {
        sourceSets.main.jniLibs.srcDirs = []
        androidResources.ignoreAssetsPattern = 'pikafish.nnue'
    }
    lint { abortOnError true }
}

// A production build cannot silently package a stale engine or mismatched net.
if (!withoutNative) {
    tasks.named('preBuild').configure {
        doFirst {
            exec {
                workingDir rootProject.projectDir
                commandLine providers.gradleProperty('pythonExecutable').getOrElse('python'), 'scripts/sync-pikafish.py'
            }
        }
    }
}

// Legacy framework test APIs are compile-time inputs for the test APK only.
// The production manifest and APK must not require Android's test libraries.
dependencies {
    androidTestCompileOnly files(
        "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.runner.jar",
        "${android.sdkDirectory}/platforms/android-${android.compileSdk}/optional/android.test.base.jar"
    )
}
